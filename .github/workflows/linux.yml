name: Linux

on:
  push:
    branches:
      - master
      - 'support/*'
  pull_request: {}

concurrency:
  group: linux-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.distro }}${{ matrix.platform != 'linux/amd64' && format(' ({0})', matrix.platform) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distro:
          # Alpine Linux to build Icinga 2 with LibreSSL, OpenBSD's default.
          # The "alpine:bash" image will be built below based on "alpine:3".
          - alpine:bash

          - amazonlinux:2023

          # Raspberry Pi OS is close enough to Debian to test just one of them.
          # Its architecture is different, though, and covered by the Docker job.
          - debian:11
          - debian:12
          - debian:13

          - fedora:42
          - fedora:43
          - fedora:44
          - fedora:45

          # We don't actually support Rocky Linux as such!
          # We just use that RHEL clone to test the original.
          - rockylinux:8
          - rockylinux:9
          - rockylinux/rockylinux:10

          # openSUSE Leap is close enough to SLES to test just one of them.
          - registry.suse.com/suse/sle15:15.6
          - registry.suse.com/suse/sle15:15.7
          - registry.suse.com/bci/bci-base:16.0

          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:25.04
          - ubuntu:25.10
          - ubuntu:26.04

        platform:
          - linux/amd64

        include:
          - distro: debian:11
            platform: linux/386
          - distro: debian:12
            platform: linux/386

    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v7

      - name: Turn on Problem Matcher
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          # The exact key is only ever written by the Save step below, so on any
          # run it won't pre-exist and restore falls through restore-keys to the
          # newest saved snapshot — i.e. the latest push to a base branch.
          key: ccache/${{ matrix.distro }}-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache/${{ matrix.distro }}-${{ matrix.platform }}-

      - name: Build Alpine Docker Image
        if: "matrix.distro == 'alpine:bash'"
        run: >-
          docker build --file .github/workflows/alpine-bash.Dockerfile
          --tag alpine:bash `mktemp -d`

      - name: Build Icinga
        run: >-
          docker run --rm -v "$(pwd):/icinga2" -e DISTRO=${{ matrix.distro }}
          --platform ${{ matrix.platform }} ${{ matrix.distro }} /icinga2/.github/workflows/linux.bash

      - name: Save ccache
        # Only update ccache on a push to master to preserve as much useful
        # artefacts as possible while staying under GitHub's 10GB size limit.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: ccache/${{ matrix.distro }}-${{ matrix.platform }}-${{ github.run_id }}
